spring:
  application:
    name: payer
  datasource:
    url: jdbc:postgresql://localhost:5434/payer_db
    username: payer
    password: payer
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat:
        model: phi4-mini
        temperature: 0.0
        seed: 42
        num-ctx: 8192
        num-predict: 1024
      embedding:
        model: nomic-embed-text:v1.5
        truncate: false
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: NONE
        distance-type: COSINE_DISTANCE

server:
  port: 8082

logging:
  level:
    org.flywaydb: INFO

payer:
  policy-documents:
    base-directory: ./payer/seed/policy-documents
  scheduler:
    request-delay: 5000
    review-delay: 5000
    policy-ingestion-delay: 5000
