services:

  payer-postgres:
    image: pgvector/pgvector:pg16
    container_name: payer-postgres
    environment:
      POSTGRES_DB: payer_db
      POSTGRES_USER: payer
      POSTGRES_PASSWORD: payer
    ports:
      - "5434:5432"
    volumes:
      - payer_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payer -d payer_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: payer-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  payer_data:
  ollama_data:
